# Noćna kopija produkcijske baze (Supabase besplatni plan nema backup).
# Kopija se šifruje (AES-256) prije nego napusti runner — repozitorij je javan i
# artefakte mogu skinuti i drugi, ali bez lozinke su bezvrijedni. Čuva se 30 dana.
#
# Potrebne tajne (Settings → Secrets and variables → Actions):
#   PROD_DATABASE_URL  — Supabase "Session pooler" adresa produkcijske baze (port 5432)
#   BACKUP_PASSPHRASE  — duga lozinka za šifrovanje; sačuvaj je i u password manageru
#
# Kad se ovaj fajl ili skripta promijene, "proba" napravi kopiju privremene baze i
# vrati je u praznu — da znamo da se iz kopije stvarno može vratiti.
# Vraćanje: Actions → "Backup baze" → Run workflow → akcija "vrati" (vidi docs/pokretanje-produkcije.md).
#   RESTORE_DATABASE_URL — tajna s adresom PRAZNE baze u koju se vraća (postavlja se tek tada)
name: Backup baze

on:
  schedule:
    - cron: "15 2 * * *" # svaku noć u 02:15 UTC (03:15/04:15 kod nas)
  workflow_dispatch:
    inputs:
      akcija:
        description: "backup = napravi kopiju sad; vrati = vrati kopiju u RESTORE_DATABASE_URL"
        type: choice
        options: [backup, vrati]
        default: backup
      run_id:
        description: "Za vraćanje: broj posla (run ID) noćnog backupa iz kojeg se vraća"
        required: false
  push:
    branches: [main]
    paths:
      - .github/workflows/backup.yml
      - scripts/backup.sh
      - scripts/restore.sh

permissions:
  contents: read

concurrency:
  group: backup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.akcija == 'backup')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.PROD_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Provjera tajni
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            # Bez tajni nema kopije — crveno, da GitHub pošalje mail, a ne tiho "uspješno"
            echo "::error::PROD_DATABASE_URL ili BACKUP_PASSPHRASE nije postavljen — kopija NIJE napravljena."
            exit 1
          fi

      - name: Kopija i šifrovanje
        run: |
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          bash scripts/backup.sh "rokovnik-$(date -u +%Y-%m-%d).dump.gpg"

      - name: Spremanje (30 dana)
        uses: actions/upload-artifact@v5
        with:
          name: rokovnik-${{ env.STAMP }}
          path: rokovnik-${{ env.STAMP }}.dump.gpg
          retention-days: 30
          if-no-files-found: error

  proba:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rokovnik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rokovnik
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/rokovnik
      DB_URL: postgres://postgres:postgres@localhost:5432/rokovnik
      PASSPHRASE: proba-samo-za-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Šema i nešto podataka
        run: |
          npx drizzle-kit migrate
          docker run --rm --network host postgres:17 psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            insert into salons (slug, name) values ('proba', 'Proba salon');
            insert into clients (salon_id, name, phone) select id, 'Ana Proba', '+38761000111' from salons where slug = 'proba';"
      - name: Kopija i šifrovanje
        run: bash scripts/backup.sh proba.dump.gpg
      - name: Vraćanje u praznu bazu i poređenje
        run: |
          set -euo pipefail
          docker run --rm --network host postgres:17 psql "postgres://postgres:postgres@localhost:5432/postgres" -c "create database vraceno"
          TARGET_URL=postgres://postgres:postgres@localhost:5432/vraceno bash scripts/restore.sh proba.dump.gpg
          q="select (select count(*) from salons) || '/' || (select count(*) from clients) || '/' || (select count(*) from drizzle.__drizzle_migrations)"
          a=$(docker run --rm --network host postgres:17 psql "$DB_URL" -tAc "$q")
          b=$(docker run --rm --network host postgres:17 psql "postgres://postgres:postgres@localhost:5432/vraceno" -tAc "$q")
          echo "original: $a  vraćeno: $b"
          [ "$a" = "$b" ]
          # I sigurnosna pravila (RLS) i zaštita od duplih termina moraju preživjeti vraćanje
          v="postgres://postgres:postgres@localhost:5432/vraceno"
          rls=$(docker run --rm --network host postgres:17 psql "$v" -tAc "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")
          excl=$(docker run --rm --network host postgres:17 psql "$v" -tAc "select count(*) from pg_constraint where contype = 'x'")
          echo "Tabela bez RLS: $rls, zaštita od preklapanja: $excl"
          [ "$rls" = "0" ] && [ "$excl" -ge 1 ]

  vrati:
    if: github.event_name == 'workflow_dispatch' && inputs.akcija == 'vrati'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
    env:
      TARGET_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
      - name: Provjera
        run: |
          [ -n "$TARGET_URL" ] || { echo "::error::Postavi tajnu RESTORE_DATABASE_URL (prazna baza za vraćanje)."; exit 1; }
          [ -n "${{ inputs.run_id }}" ] || { echo "::error::Upiši run_id noćnog backupa."; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: kopija
          merge-multiple: true
      - name: Vraćanje
        run: bash scripts/restore.sh "$(ls kopija/*.dump.gpg | head -1)"
